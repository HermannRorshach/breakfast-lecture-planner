{% load static %}

<link rel="stylesheet" href="{% static 'css/calendar.css' %}">

<section class="schedule-calendar"
         data-schedule-calendar
         data-schedule-url="{% url 'planner:daily_schedule' %}"
         data-edit-icon="{% static 'icons/pen-to-square-regular-full.svg' %}"
         data-can-edit="{% if daily_schedule_form %}true{% else %}false{% endif %}"
         aria-labelledby="calendar-title">
  <div class="schedule-calendar__heading">
    <h2 id="calendar-title" class="schedule-calendar__title">Kartikos mėnuo</h2>

    <div class="schedule-calendar__selectors" aria-label="Pasirinkite datą">
      <label>
        <span class="visually-hidden">Mėnuo</span>
        <select class="schedule-calendar__select" data-calendar-month>
          <option value="0">Sausis</option>
          <option value="1">Vasaris</option>
          <option value="2">Kovas</option>
          <option value="3">Balandis</option>
          <option value="4">Gegužė</option>
          <option value="5">Birželis</option>
          <option value="6">Liepa</option>
          <option value="7">Rugpjūtis</option>
          <option value="8">Rugsėjis</option>
          <option value="9">Spalis</option>
          <option value="10">Lapkritis</option>
          <option value="11">Gruodis</option>
        </select>
      </label>

      <label>
        <span class="visually-hidden">Metai</span>
        <select class="schedule-calendar__select" data-calendar-year>
          <option>2024</option>
          <option>2025</option>
          <option>2026</option>
          <option>2027</option>
          <option>2028</option>
          <option>2029</option>
          <option>2030</option>
        </select>
      </label>
    </div>
  </div>

  <div class="schedule-calendar__week-navigation">
    <button class="schedule-calendar__week-button"
            type="button"
            data-calendar-week-previous
            aria-label="Ankstesnė savaitė">
      <img src="{% static 'icons/slider_row_left.svg' %}" alt="">
    </button>

    <div class="schedule-calendar__week-viewport">
      <div class="schedule-calendar__week-edge" data-calendar-week-previous-days aria-hidden="true"></div>
      <div class="schedule-calendar__week" data-calendar-week aria-label="Savaitės dienos"></div>
      <div class="schedule-calendar__week-edge" data-calendar-week-next-days aria-hidden="true"></div>
    </div>

    <button class="schedule-calendar__week-button"
            type="button"
            data-calendar-week-next
            aria-label="Kita savaitė">
      <img src="{% static 'icons/slider_row_right.svg' %}" alt="">
    </button>
  </div>

  <div class="schedule-calendar__categories" aria-label="Datos kategorijos">
    <span class="schedule-calendar__category schedule-calendar__category--ekadashi"
          data-calendar-category="ekadashi">Ekadaši</span>
    <span class="schedule-calendar__category schedule-calendar__category--holiday"
          data-calendar-category="holiday">Šventės</span>
    <span class="schedule-calendar__category schedule-calendar__category--festival"
          data-calendar-category="festival">Festivaliai</span>
    <span class="schedule-calendar__category schedule-calendar__category--saints"
          data-calendar-category="saints">Šventųjų asmenybių atėjimo / išėjimo dienos</span>
  </div>

  <div class="schedule-calendar__schedules"
       data-calendar-schedules
       aria-live="polite"></div>

  {% if daily_schedule_form %}
    <div class="daily-schedule-editor" data-daily-schedule-editor hidden>
      <form data-daily-schedule-form>
        {% csrf_token %}
        <input type="hidden" name="date" data-daily-schedule-date>
        {{ daily_schedule_form.content }}
        <p class="daily-schedule-editor__error" data-daily-schedule-error hidden></p>
        <div class="daily-schedule-editor__actions">
          <button type="submit" class="btn btn-success">Сохранить</button>
          <button type="button" class="btn btn-secondary" data-daily-schedule-cancel>Отмена</button>
        </div>
      </form>
    </div>
  {% endif %}

  <div class="schedule-calendar__day-navigation" aria-label="Dienų navigacija">
    <button type="button" data-calendar-day-previous aria-label="Ankstesnė diena">←</button>
    <button type="button" data-calendar-day-next aria-label="Kita diena">→</button>
  </div>
</section>

<script src="{% static 'js/calendar.js' %}" defer></script>
