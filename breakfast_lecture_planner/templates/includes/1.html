<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Меню</title>
    <style>
    .wrapper {
  width: 100%;
  background-color: #ccc;
  margin: 0px auto;
  height: 300px;
}

.menu {
  background-color: #FB7E35;
}

.menuitem {
  display: inline-block;
  color: #800;
  padding: 10px;
}

.menuitem.active {
  background-color: wheat;
}

.submenu_wrapper {
  background-color: wheat;
  position: absolute;
  left: 0;
  right: 0;
}

.submenu {
  width: 100%;
  margin: 0px auto;
  height: 200px;
  box-shadow: 0 0 10px red inset;
}
    </style>
  </head>
  <body>
    <div class="header-top">
      <img src="{% static 'img/new_logo.png' %}"
           alt="ISKCON Vilnius Logo"
           class="logo">
      <div class="wrapper">
        <a href="#" class="button orange small">Registracija šeštadienio pietums</a>
        Container
        <div class="menu">
          <div class="menuitem">Menu 1</div>
          <div class="menuitem">Menu 2</div>
          <div class="menuitem active">
            Menu 3
            <div class="submenu_wrapper">
              <div class="submenu">Submenu here</div>
            </div>
          </div>
          <div class="menuitem">Menu 4</div>
        </div>
      </div>
    </div>
  </body>
</html>
