server {
    listen 80;  # ← изменил на 80
    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        proxy_pass http://breakfast_lecture_planner:8000;  # ← имя сервиса
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/www/breakfast_lecture_planner/staticfiles/;  # ← убрал лишнюю "a"
        expires 30d;
    }

    location /media/ {
        alias /app/www/breakfast_lecture_planner/media/;  # ← убрал лишнюю "a"
        expires 30d;
    }

    location /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
