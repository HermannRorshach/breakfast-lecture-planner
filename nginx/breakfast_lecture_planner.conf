# Redirect HTTP requests to the canonical HTTPS domain. Certbot challenges
# remain available over HTTP for certificate renewal.
server {
    listen 80;
    server_name malone.guru www.malone.guru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://malone.guru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name malone.guru;

    ssl_certificate /etc/letsencrypt/live/malone.guru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malone.guru/privkey.pem;

    location / {
        proxy_pass http://breakfast_lecture_planner:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/www/breakfast_lecture_planner/staticfiles/;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /media/ {
        alias /app/www/breakfast_lecture_planner/media/;
        expires 30d;
    }

    location /favicon.ico {
        access_log off;
        log_not_found off;
    }
}

server {
    listen 443 ssl;
    server_name www.malone.guru;

    ssl_certificate /etc/letsencrypt/live/malone.guru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malone.guru/privkey.pem;

    return 301 https://malone.guru$request_uri;
}
